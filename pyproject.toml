[project]
name = "business-forecasting-dashboard"
version = "0.1.0"
description = "Import business history, get backtested forecasts with uncertainty bands, data-quality reports and explicit assumptions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rayyan Anwar" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scipy>=1.11,<2", "scikit-learn>=1.4,<2", "fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E741", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
